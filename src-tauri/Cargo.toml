[package]
name = "librerar"
version = "0.1.0"
description = "LibreRAR — gestionnaire d'archives libre (RAR, ZIP, 7z)"
authors = ["LibreFlow"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "librerar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.3.0", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
sevenz-rust = { version = "0.6.1", features = ["aes256"] }
unrar = "0.5"
# tar ≥ 0.4.45 exclusivement : CVE-2026-33056 (chmod hors racine à
# l'extraction via unpack) corrigée à partir de cette version.
tar = "0.4.45"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
base64 = "0.22"
sha2 = "0.10"
tauri-plugin-opener = "2.7.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
